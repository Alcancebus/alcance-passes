<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Portal CIM do Ave - Alcance Bus</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f6f7;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        form {
            margin-bottom: 25px;
        }

        input, button {
            padding: 9px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
        }

        .csv {
            margin-left: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: white;
            text-align: left;
        }

        th, td {
            padding: 11px;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f7f7f7;
        }

        tr:hover {
            background: #eeeeee;
        }

        .numero {
            text-align: center;
            font-weight: bold;
        }

        a {
            color: #0066cc;
        }

        .sair {
            color: #b00020;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topo">
        <div>
            <h1>Portal CIM do Ave</h1>
            <strong>Alcance Bus</strong>
        </div>

        <a class="sair" href="/logout">Sair</a>
    </div>

    <form method="get" action="/cim">

        <label>
            <strong>Mês:</strong>
        </label>

        <input
            type="month"
            name="month"
            value="{{month}}"
        >

        <button type="submit">
            Consultar
        </button>

        <a class="csv"
           href="/cim/export.csv?month={{month}}">
            Exportar CSV mensal
        </a>

    </form>

    <table>

        <thead>
            <tr>
                <th>Data / Hora</th>
                <th>Linha</th>
                <th>Sentido</th>
                <th>Autocarro</th>
                <th>Passageiros</th>
            </tr>
        </thead>

        <tbody>

        {% for t,n in data %}

            <tr>

                <td>
                    <a href="/cim/trip/{{t.id}}">
                        {{t.started_at.strftime("%d/%m/%Y %H:%M")}}
                    </a>
                </td>

                <td>{{t.line}}</td>

                <td>{{t.direction}}</td>

                <td>{{t.device}}</td>

                <td class="numero">
                    {{n}}
                </td>

            </tr>

        {% else %}

            <tr>
                <td colspan="5">
                    Não existem viagens registadas neste mês.
                </td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
