<html><body style="font-family:Arial;margin:30px"><h1>Portal CIM do Ave</h1><form><input type="month" name="month" value="{{month}}"><button>Consultar</button> <a href="/cim/export.csv?month={{month}}">CSV mensal</a></form><table border="1" cellpadding="7"><tr><th>Data/hora</th><th>Linha</th><th>Sentido</th><th>Autocarro</th><th>Passageiros</th></tr>{% for t,n in data %}<tr><td><a href="/cim/trip/{{t.id}}">{{t.started_at.strftime("%d/%m/%Y %H:%M")}}</a></td><td>{{t.line}}</td><td>{{t.direction}}</td><td>{{t.device}}</td><td>{{n}}</td></tr>{% endfor %}</table></body></html>
