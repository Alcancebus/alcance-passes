<html><body style="font-family:Arial;margin:30px"><h1>Passageiros da viagem</h1><p>{{trip.line}} — {{trip.direction}}</p><table border="1" cellpadding="7"><tr><th>Hora</th><th>Nome</th><th>N.º passe</th><th>Estado</th></tr>{% for v,p in rows %}<tr><td>{{v.timestamp.strftime("%H:%M")}}</td><td>{{p.name if p else ""}}</td><td>{{p.pass_number if p else ""}}</td><td>{{v.result}}</td></tr>{% endfor %}</table></body></html>
