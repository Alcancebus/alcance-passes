<html><body style="font-family:Arial;margin:30px"><h1>Administração Alcance Bus</h1><a href="/cim">Portal CIM</a> | <a href="/logout">Sair</a><h2>Novo passe</h2><form method="post" action="/admin/passenger"><input name="name" placeholder="Nome"><input name="pass_number" placeholder="N.º passe"><input name="card_uid" placeholder="UID NFC"><input type="date" name="valid_until"><button>Criar</button></form><h2>Passes</h2><table border="1" cellpadding="6"><tr><th>Nome</th><th>N.º</th><th>UID</th><th>Validade</th></tr>{% for p in passengers %}<tr><td>{{p.name}}</td><td>{{p.pass_number}}</td><td>{{p.card_uid}}</td><td>{{p.valid_until}}</td></tr>{% endfor %}</table></body></html>
