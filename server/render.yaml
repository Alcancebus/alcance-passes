services:
- type: web
  name: alcance-passes
  runtime: python
  rootDir: server
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: alcance-passes-db
      property: connectionString
  - key: SESSION_SECRET
    generateValue: true
  - key: DEVICE_TOKEN
    generateValue: true
databases:
- name: alcance-passes-db
